[package]
name = "prysm-webos-capture"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native webOS video capture sender for Prysm"

[dependencies]
prysm-metrics = { path = "../../common/prysm-metrics" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { workspace = true, features = ["derive"] }
libc.workspace = true
libloading.workspace = true
memmap2.workspace = true
nix = { workspace = true, features = ["poll", "user", "socket", "fs", "signal", "pthread"] }
serde_json.workspace = true
prysm-webos-protocol = { path = "../prysm-webos-protocol", features = ["cli", "h264"] }
yuv = { workspace = true, features = ["fast_mode"] }

[build-dependencies]
cc.workspace = true

[lints]
workspace = true
