[package]
name = "prysm-webos-protocol"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
h264 = ["dep:openh264", "dep:yuv", "dep:h264-reader"]

[dependencies]
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
lz4_flex = { workspace = true, features = ["std", "safe-encode", "safe-decode"] }
h264-reader = { workspace = true, optional = true }
openh264 = { workspace = true, optional = true }
yuv = { workspace = true, features = ["fast_mode"], optional = true }

[lints]
workspace = true
