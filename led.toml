# DDP uses UDP port 4048. Set this to your WLED instance.
wled_address = "192.168.18.37:4048"

# 0 = off, 100 = full brightness. Defaults to 80 when omitted.
brightness_percent = 100

# Counts by screen edge, viewed from the front.
# Wiring: bottom-left -> top-left -> top-right -> bottom-right -> bottom-left.
[leds]
top = 51
right = 31
bottom = 49
left = 31

[source]
type = "camera"
# Without a path, video uses the local Philips HDR test clip.
# path = "/path/to/video.mp4"
# For camera capture, use type = "camera" and optionally:
device = "0x2200000345f2131" # Linux path or macOS AVFoundation device UID
