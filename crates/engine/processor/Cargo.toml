[package]
name = "prysm-processor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Video edge colour sampling and smoothing for Prysm"

[features]
# `PrysmProcessor::process_frame` on the wall clock, for tests.
testkit = []

[dependencies]
prysm-core.workspace = true
rayon.workspace = true
tracing.workspace = true

[dev-dependencies]
prysm-core = { workspace = true, features = ["testkit"] }
prysm-processor = { path = ".", features = ["testkit"] }

# Not the workspace lints: examples/frame_recycling.rs counts allocations with
# an unsafe GlobalAlloc, which `forbid` would reject.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
