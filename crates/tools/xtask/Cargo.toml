[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "cargo xtask: one entry point for codegen, checks and build artifacts"

# Must build fast on a fresh checkout: no Prysm crate but prysm-version.
[dependencies]
anyhow = "1"
clap.workspace = true
# RFC 3339 build times in dist/manifest.json.
humantime = "2"
prysm-version.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
# Iterating the variants of check steps and doctor tools.
strum = { version = "0.28", features = ["derive"] }
# rust-toolchain.toml, for doctor.
toml = "1"

[lints]
workspace = true
