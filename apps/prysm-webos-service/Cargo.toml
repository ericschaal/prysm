[package]
name = "prysm-webos-service"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Native Luna service for Prysm webOS capture"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
hardware-h264 = []
embedded-prysm = ["prysm-webos-protocol/embedded-prysm"]
codegen = ["dep:bindgen"]
schema = ["dep:utoipa", "prysm-webos-protocol/schema"]

[dependencies]
prysm-contract = { path = "../../crates/common/prysm-contract" }
thiserror.workspace = true
prysm-webos-protocol = { path = "../../crates/capture/prysm-webos-protocol" }
anyhow.workspace = true
atomic-write-file.workspace = true
libc.workspace = true
nix = { workspace = true, features = ["fs", "process", "signal", "user"] }
serde = { workspace = true, features = ["derive"] }
clap = { workspace = true, features = ["derive"] }
libloading.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
bindgen = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
tempfile.workspace = true

[[bin]]
name = "generate-luna-bindings"
path = "codegen/main.rs"
required-features = ["codegen"]

[[bin]]
name = "export-service-schema"
path = "src/bin/export-service-schema.rs"
required-features = ["schema"]

[lints]
workspace = true
