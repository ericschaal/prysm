[package]
name = "prysm-contract"
version = "0.1.0"
edition = "2024"
description = "Validated configuration and wire contracts for Prysm"

[lints]
workspace = true

[dependencies]
prysm-core = { path = "../prysm-core" }
serde = { version = "1", features = ["derive"] }
utoipa = { version = "5", features = ["uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = { version = "2", features = ["serde"] }
anyhow.workspace = true

[dev-dependencies]
serde_json = "1"
toml = "1"
