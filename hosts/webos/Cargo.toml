[package]
name = "prysm-webos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TV worker (full): webOS capture into WLED with the web portal, run by prysm-webos-service"

[dependencies]
prysm-webos-link = { workspace = true, features = ["worker"] }
prysm-ports.workspace = true
prysm-runtime = { workspace = true, features = ["logging"] }
prysm-capture-webos.workspace = true
prysm-output-wled.workspace = true
prysm-settings-file.workspace = true
prysm-web-portal.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
prysm-runtime = { workspace = true, features = ["testkit"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["time", "rt", "macros"] }

[lints]
workspace = true
