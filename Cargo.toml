[workspace]
resolver = "3"
members = [
    "crates/capture/prysm-capture",
    "crates/processing/prysm-processor",
    "crates/common/prysm-core",
    "crates/rendering/prysm-renderer-wled",
]

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/ericschaal/prysm"
readme = "README.md"
keywords = ["ambilight", "lighting", "video", "wled"]
categories = ["multimedia::video"]

# The video pipeline does per-pixel work on full HD frames; unoptimized dev
# builds make it burn >100% CPU. Lightly optimize workspace code and fully
# optimize dependencies (yuv, codecs) while keeping debug assertions on.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_errors_doc = "allow"

[workspace.dependencies]
anyhow = "=1.0.104"
av-foundation = "=0.8.1"
core-foundation = { version = "=0.10.1", default-features = false }
core-media = { version = "=0.8.1", default-features = false }
core-video = { version = "=0.6.1", default-features = false }
ddp-rs = "=1.3.0"
dispatch2 = "=0.3.1"
futures = "=0.3.34"
libc = "=0.2.191"
rustix = { version = "=1.1.6", default-features = false }
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
thiserror = "=2.0.21"
tokio = "=1.54.1"
tokio-util = "=0.7.20"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
yuv = { version = "=0.8.20", default-features = false }
