# Gate for the v1 workspace (v1/Cargo.toml) and its npm workspace (v1/frontend).
# v1-release.yml also calls it, so a release is built only from a green gate.
#
# The hosts include! v1/frontend/dist, so `frontend` builds it once and the Rust
# jobs download it before compiling. Codegen runs the Rust contract exporter,
# which is why `frontend` also needs Rust and libclang.
#
# TV crates (armv7-unknown-linux-gnueabi):
# - `webos-armv7` lints (clippy -D warnings) every TV crate that compiles
#   without the webOS SDK, with Ubuntu's stock soft-float cross compiler (the
#   C++ in capture-webos-sys and OpenH264 only need a g++; Luna and VTCapture
#   are loaded at run time), and runs their unit tests under qemu-user. Only
#   prysm-webos-slim and prysm-h264-rvenc-sys (prysm-h264's `hardware`
#   feature) need the SDK: their GStreamer sys crates look up the sysroot's
#   GStreamer with pkg-config.
# - `webos-ipk` installs the pinned SDK (as check.yml does), checks the Luna
#   bindings against its headers, lints the SDK-only TV crates and builds both
#   IPKs with build-ipk.sh, which links against the sysroot and checks the
#   binaries with ipk.py.
#
# Not here: the root workspace check, Markdown links and actionlint run in
# check.yml on every push and pull request; on-TV tests (native-smoke.py) need a
# TV. Miri cannot run webos-luna-sys's tests yet: its mock hands the generated
# API a `Library::this()` (dlopen), which Miri does not support.
name: V1 workspace
on:
  push:
    # Branches only: tag pushes skip path filters, and v1 release tags run this
    # through v1-release.yml.
    branches: ['**']
    paths:
      - 'v1/**'
      # Path dependencies outside v1/ and the root workspace they inherit from.
      - 'Cargo.toml'
      - 'clippy.toml'
      - 'crates/common/prysm-core/**'
      - 'crates/common/prysm-metrics/**'
      - 'crates/processing/prysm-processor/**'
      - 'crates/capture/prysm-capture/**'
      - 'crates/capture/prysm-webos-protocol/**'
      - 'crates/rendering/prysm-renderer-wled/**'
      - '.github/workflows/v1.yml'
  pull_request:
    paths:
      - 'v1/**'
      # Path dependencies outside v1/ and the root workspace they inherit from.
      - 'Cargo.toml'
      - 'clippy.toml'
      - 'crates/common/prysm-core/**'
      - 'crates/common/prysm-metrics/**'
      - 'crates/processing/prysm-processor/**'
      - 'crates/capture/prysm-capture/**'
      - 'crates/capture/prysm-webos-protocol/**'
      - 'crates/rendering/prysm-renderer-wled/**'
      - '.github/workflows/v1.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Not `github.workflow`: when v1-release.yml calls this, that is the caller's
  # name, and an identical group would deadlock the caller.
  group: v1-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # v1/frontend/package.json engines: node >=24.
          node-version: '24'
          cache: npm
          cache-dependency-path: v1/frontend/package-lock.json
      - name: Rust and libclang for the contract exporter
        # prysm-capture -> v4l2-sys-mit generates its bindings with bindgen.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev
          rustup update stable --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v1 -> target
          key: v1-frontend
      - run: npm --prefix v1/frontend ci
      # Check before building: the build regenerates the contracts.
      - name: Generated contracts are current
        run: npm --prefix v1/frontend run codegen:check
      - name: Build bundles and run frontend tests
        # `npm test` runs `npm run build` (codegen, typecheck, bundles, assets.rs) first.
        run: npm --prefix v1/frontend test
      - uses: actions/upload-artifact@v4
        with:
          name: v1-frontend-dist
          path: v1/frontend/dist
          if-no-files-found: error
          retention-days: 1

  rust:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Update Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # prysm-capture -> v4l2-sys-mit generates its bindings with bindgen.
        # OpenH264 builds without nasm (no assembly), as in the release image.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v1 -> target
          key: v1-rust
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path v1/Cargo.toml --all --check
      - name: Package file and ipk.py tests
        if: runner.os == 'Linux'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 v1/packaging/webos/tests/test_ipk.py
      - name: Frontend bundle for the hosts' include!
        uses: actions/download-artifact@v4
        with:
          name: v1-frontend-dist
          path: v1/frontend/dist
      # The file source's real-FFmpeg test skips without ffmpeg on PATH and its
      # filter needs FFmpeg 9+, which Ubuntu 24.04 does not ship (as in check.yml).
      - name: Install FFmpeg 9+
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew install ffmpeg
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: FFmpeg is 9 or newer
        run: |
          ffmpeg -version | head -n 1
          major=$(ffmpeg -version | sed -n '1s/^ffmpeg version n\{0,1\}\([0-9][0-9]*\).*/\1/p')
          [ "${major:-0}" -ge 9 ]
      # --all-features costs nothing extra: the exporter already enables every schema feature.
      - name: Lint all targets
        run: cargo clippy --manifest-path v1/Cargo.toml --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test all targets
        run: cargo test --manifest-path v1/Cargo.toml --locked --workspace --all-targets --all-features
      # --all-targets skips doctests.
      - name: Doctests
        run: cargo test --manifest-path v1/Cargo.toml --locked --workspace --doc --all-features

  webos-armv7:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABI_LINKER: arm-linux-gnueabi-gcc
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABI_RUNNER: qemu-arm -L /usr/arm-linux-gnueabi
      CC_armv7_unknown_linux_gnueabi: arm-linux-gnueabi-gcc
      CXX_armv7_unknown_linux_gnueabi: arm-linux-gnueabi-g++
      AR_armv7_unknown_linux_gnueabi: arm-linux-gnueabi-ar
      # As v1/packaging/webos/env.sh sets them (without the SDK sysroot):
      # OpenH264's ARM assembly is NEON.
      CFLAGS_armv7_unknown_linux_gnueabi: -mfloat-abi=softfp -mfpu=neon
      CXXFLAGS_armv7_unknown_linux_gnueabi: -mfloat-abi=softfp -mfpu=neon
    steps:
      - uses: actions/checkout@v4
      - name: ARM soft-float cross compiler and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-arm-linux-gnueabi qemu-user
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          rustup target add armv7-unknown-linux-gnueabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v1 -> target
          key: v1-webos-armv7
      - name: Frontend bundle for prysm-webos's include!
        uses: actions/download-artifact@v4
        with:
          name: v1-frontend-dist
          path: v1/frontend/dist
      # Not prysm-webos-slim or prysm-h264-rvenc-sys: they need the SDK
      # sysroot's GStreamer (webos-ipk lints them).
      - name: Lint the TV crates for armv7
        run: >-
          cargo clippy --manifest-path v1/Cargo.toml --locked --all-targets
          --target armv7-unknown-linux-gnueabi
          -p prysm-webos-link -p prysm-webos-service -p prysm-webos
          -p prysm-capture-webos -p prysm-capture-webos-sys -p prysm-webos-luna-sys
          -p prysm-capture-remote -p prysm-h264
          -- -D warnings
      # Library tests only: integration tests start the armv7 binaries
      # themselves, which needs binfmt_misc rather than the cargo runner.
      # Skipped test: qemu-user reports a successful spawn for a missing
      # program (it fails after the fork); the `rust` job runs it natively.
      - name: ABI, exception boundary, Luna wrapper and supervisor tests under qemu
        run: >-
          cargo test --manifest-path v1/Cargo.toml --locked --lib
          --target armv7-unknown-linux-gnueabi
          -p prysm-capture-webos-sys -p prysm-webos-luna-sys
          -p prysm-webos-link -p prysm-webos-service
          -- --skip launcher::tests::a_missing_program_fails_to_spawn

  webos-ipk:
    # The SDK below is built for aarch64 hosts.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      WEBOS_SDK: ${{ github.workspace }}/.webos-sdk/arm-webos-linux-gnueabi_sdk-buildroot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: v1/frontend/package-lock.json
      - name: webOS build dependencies
        # libclang: the contract exporter (prysm-capture -> v4l2-sys-mit) and
        # the Luna binding generator. ares-package: build-ipk.sh.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev file python3
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          rustup target add armv7-unknown-linux-gnueabi
          npm install --global @webos-tools/cli@3.2.6
      # The same pinned SDK as check.yml's webos-package job.
      - name: Install pinned webOS SDK
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/webos-sdk.tar.gz" \
            https://github.com/openlgtv/buildroot-nc4/releases/download/2026.08-webos/arm-webos-linux-gnueabi_sdk-buildroot-aarch64.tar.gz
          echo "3a9330f3789f8008ece7c8a48f58c3a71d0307a9a1f81896db938b785524c3ce  $RUNNER_TEMP/webos-sdk.tar.gz" | sha256sum --check
          mkdir -p "$(dirname "$WEBOS_SDK")"
          tar -xzf "$RUNNER_TEMP/webos-sdk.tar.gz" -C "$(dirname "$WEBOS_SDK")"
          "$WEBOS_SDK/relocate-sdk.sh"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v1 -> target
          key: v1-webos-ipk-2026.08-webos
      - name: Luna and GLib bindings match the SDK headers
        run: >-
          cargo run --manifest-path v1/Cargo.toml --locked -p prysm-webos-luna-sys
          --features codegen --bin generate-luna-bindings -- --check
      - name: Frontend bundles
        run: |
          npm --prefix v1/frontend ci
          npm --prefix v1/frontend run build
      - name: Fetch crates
        # build-ipk.sh builds with --offline.
        run: cargo fetch --manifest-path v1/Cargo.toml --locked
      # prysm-webos-slim enables prysm-h264's `hardware` feature, so this also
      # lints the arm-only GStreamer code in prysm-h264-rvenc-sys.
      - name: Lint the SDK-only TV crates for armv7
        run: |
          . v1/packaging/webos/env.sh
          cargo clippy --manifest-path v1/Cargo.toml --locked --offline --all-targets \
            --target armv7-unknown-linux-gnueabi \
            -p prysm-webos-slim -p prysm-h264-rvenc-sys -p prysm-h264 -- -D warnings
      - name: Build and verify both IPKs
        run: |
          v1/packaging/webos/build-ipk.sh full --out "$RUNNER_TEMP/ipk/full"
          v1/packaging/webos/build-ipk.sh slim --out "$RUNNER_TEMP/ipk/slim"
      # Both flavours are io.prysm.tv_<version>_all.ipk: one artifact each.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: prysm-tv-ipk-full
          path: ${{ runner.temp }}/ipk/full/*.ipk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: prysm-tv-ipk-slim
          path: ${{ runner.temp }}/ipk/slim/*.ipk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

