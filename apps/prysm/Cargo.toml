[package]
name = "prysm"
version = "0.2.0"
edition = "2024"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Capture and process video for WLED with browser preview"

[package.metadata.deb]
license-file = "../../LICENSE"
name = "prysm-led"
maintainer = "Eric Schaal <eric@schaal.dev>"
depends = "$auto, systemd, init-system-helpers"
section = "video"
priority = "optional"
maintainer-scripts = "../../packaging/debian"
assets = [
    ["target/release/prysm", "usr/bin/prysm", "755"],
    ["../../packaging/debian/prysm.conf", "usr/lib/sysusers.d/prysm.conf", "644"],
    ["../../packaging/debian/README.md", "usr/share/doc/prysm-led/README.md", "644"],
]

[[package.metadata.deb.systemd-units]]
unit-name = "prysm"
enable = false
start = false
stop-on-upgrade = false
restart-after-upgrade = true

[lints]
workspace = true

[dependencies]
prysm-runtime = { path = "runtime", features = ["host-input"] }
prysm-metrics = { path = "../../crates/common/prysm-metrics" }
clap = { workspace = true, features = ["derive", "env"] }
tracing-subscriber.workspace = true
tracing.workspace = true
anyhow.workspace = true

[dev-dependencies]
prysm-contract = { path = "../../crates/common/prysm-contract" }
prysm-webos-protocol = { path = "../../crates/capture/prysm-webos-protocol" }
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite.workspace = true
futures.workspace = true
axum = { workspace = true, features = ["ws"] }
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
rustls.workspace = true
serde_json.workspace = true
tempfile.workspace = true
