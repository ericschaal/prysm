# Example: prysm-headless with a USB capture device.
#   docker build -f v1/packaging/docker/Dockerfile -t prysm-headless:local .
#   docker compose -f v1/packaging/docker/compose.yaml up -d
# Portal: http://<this machine>:8787 (no password: anyone who can reach the
# port controls the lights; publish it on a trusted LAN only).
services:
  prysm:
    image: prysm-headless:local
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    environment:
      RUST_LOG: warn,prysm=info
    # Extra host options, appended after the settings path.
    # command: ["--start"]
    ports:
      # The portal; a slim TV ("remote" source) streams to it too.
      - "8787:8787"
    devices:
      - /dev/video0:/dev/video0
    # The device's group on the host; replace 44 when `getent group video`
    # shows another GID.
    group_add: ["44"]
    volumes:
      - prysm-data:/data
    # A bridge network cannot resolve mDNS names such as wled.local: use the
    # WLED's IP address, or uncomment and drop `ports`.
    # network_mode: host

volumes:
  prysm-data:
