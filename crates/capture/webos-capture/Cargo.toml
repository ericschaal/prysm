[package]
name = "prysm-webos-capture"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
prysm-metrics = { path = "../../common/prysm-metrics" }
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
libc = "0.2"
libloading = "0.8"
memmap2 = "0.9"
nix = { version = "0.31", features = ["poll", "user", "socket"] }
signal-hook = "0.3"
prysm-webos-protocol = { path = "../prysm-webos-protocol", features = ["h264"] }
yuv = { version = "0.8", default-features = false, features = ["fast_mode"] }

[build-dependencies]
cc = "1"

[lints]
workspace = true
