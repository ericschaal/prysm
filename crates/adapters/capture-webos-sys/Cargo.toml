[package]
name = "prysm-capture-webos-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "LG webOS VTCapture and HAL GAL FFI behind safe, single-threaded capture handles"

[dependencies]
libloading.workspace = true
libc = "0.2"
strum.workspace = true
thiserror.workspace = true
prysm-webos-library-sys.workspace = true
# The one Luna binding: the registration precheck.
prysm-webos-luna-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# The surface check's entry for the fuzz targets in fuzz/; never shipped.
fuzzing = []

[build-dependencies]
cc = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
print_stdout = "deny"
undocumented_unsafe_blocks = "deny"
