[package]
name = "prysm-capture-device-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "V4L2 and AVFoundation video capture threads behind a safe callback API"

[dependencies]
anyhow = "1.0.104"
prysm-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rustix = { version = "1.1.6", default-features = false, features = ["time"] }
v4l = { git = "https://github.com/raymanfx/libv4l-rs.git", rev = "30f6dbaeed5cdb1b33760fc5b35c1b545cfe0e46" }

[target.'cfg(target_os = "macos")'.dependencies]
av-foundation = "0.8.1"
core-foundation = { version = "0.10.1", default-features = false }
core-media = { version = "0.8.1", default-features = false, features = ["objc"] }
core-video = { version = "0.6.1", default-features = false, features = ["objc"] }
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSDictionary", "NSEnumerator", "NSError", "NSNotification", "NSObject", "NSString", "NSValue"] }

# One of the four crates allowed to use `unsafe` (with capture-webos-sys,
# webos-luna-sys and h264-rvenc-sys): the V4L2 buffers and AVFoundation's
# Objective-C API.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
