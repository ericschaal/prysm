# Replace the image version, LAN address, and dataset path for your installation.
services:
  prysm:
    image: ghcr.io/ericschaal/prysm:0.1.0
    user: "568:568"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 90s
    environment:
      PRYSM_ALLOWED_HOSTS: "192.168.1.20:8787,truenas.local:8787"
    ports:
      - "192.168.1.20:8787:8787"
    volumes:
      - type: bind
        source: /mnt/tank/apps/prysm
        target: /config
        bind:
          create_host_path: false
