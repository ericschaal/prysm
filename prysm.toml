# Choose device/file input and wled/egui output.
brightness_percent = 100

# Color samples per 1000 pixels of cropped edge length. Defaults to 128.
sample_density = 128

# capture / decoded video size [width, height]. Defaults to [640, 360].
capture_resolution = [640, 360]

# Counts by screen edge, viewed from the front.
# Wiring: bottom-left -> top-left -> top-right -> bottom-right -> bottom-left.
[output]
type = "wled"
address = "192.168.18.37:4048"
# Maximum WLED sends per second; positive integer, defaults to 30.
refresh_rate_hz = 50

[output.leds]
top = 51
right = 31
bottom = 49
left = 31

[input]
type = "device"
device = "0x2200000345f2131" # Linux path or macOS AVFoundation device UID
