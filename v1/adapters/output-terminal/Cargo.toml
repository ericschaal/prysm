[package]
name = "prysm-output-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
wire = ["dep:serde"]

[dependencies]
prysm-contract.workspace = true
prysm-core.workspace = true
prysm-output.workspace = true
tokio.workspace = true
futures.workspace = true
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
# Use level-triggered polling so bounded reads do not strand input after a scroll burst.
crossterm = { version = "0.28", default-features = false, features = ["events", "use-dev-tty"] }
ratatui-image = { version = "8.1.1", default-features = false, features = ["crossterm"] }
image = { version = "0.25.6", default-features = false, features = ["png"] }
serde = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "0.38", features = ["termios", "fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
