<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f7fb">
  <title>Prysm · Light control</title>
  <style>:root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #292c38; background: #f7f7fb; font-synthesis: none; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; }
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid #9188f4; outline-offset: 5px; }
main { width: min(100% - 40px, 480px); margin: 0 auto; padding: 38px 0 32px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; color: #262838; text-decoration: none; font-weight: 700; font-size: 29px; letter-spacing: -1.6px; min-height: 44px; }
.logo { width: 31px; height: 31px; }
.brand-dot { color: #8f72d8; }
.connection { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #616577; white-space: nowrap; }
i { display: inline-block; width: 6px; height: 6px; flex: 0 0 6px; border-radius: 50%; background: #7c8880; }
.ready i { background: #7771c4; box-shadow: 0 0 0 4px #7771c40c; }
.attention i { background: #a17125; }
.connection.is-pending i { animation: connection-pending 1.4s ease-in-out infinite; }
.intro { margin: 44px 0 26px; }
h1 { font-size: clamp(34px, 7vw, 40px); font-weight: 550; letter-spacing: -1.8px; line-height: 1.15; margin: 0; }
.power-panel { position: relative; isolation: isolate; overflow: hidden; border-radius: 26px; padding: 32px; background: #262833; color: #dbdde8; box-shadow: 0 8px 22px #20233b0d; transition: background-color 650ms ease, color 650ms ease, box-shadow 650ms ease; }
.power-panel::before { content: ""; position: absolute; z-index: -1; inset: -40%; background: radial-gradient(ellipse at 12% 24%, #fa4c8c66, transparent 52%), radial-gradient(ellipse at 52% 0%, #ab60ff70, transparent 60%), radial-gradient(ellipse at 88% 50%, #368bff70, transparent 56%), radial-gradient(ellipse at 80% 100%, #38dcd442, transparent 52%); opacity: 0; transform: scale(.8); transition: opacity 900ms ease, transform 900ms ease; pointer-events: none; }
.power-panel.is-on { background: #1c2035; color: #faf9ff; box-shadow: -8px 8px 35px #e967a718, 8px 10px 35px #548bde20; }
.power-panel.is-on::before { opacity: 1; transform: scale(1); animation: ambient 14s ease-in-out infinite alternate; }
.power-heading { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 20px; min-height: 100px; }
.eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 2px; margin: 0 0 8px; color: #b8baca; }
h2 { font-size: clamp(42px, 10vw, 54px); letter-spacing: -2px; line-height: 1.1; font-weight: 500; margin: 0; }
h2 span { display: inline-block; animation: state-in 350ms ease both; }
.power-button { position: relative; display: grid; place-items: center; width: 76px; height: 76px; flex-shrink: 0; padding: 0; border: 1px solid #d6d6ef40; border-radius: 50%; background: #ffffff09; color: #d2d2e1; box-shadow: 0 0 0 8px #ffffff03; transition: transform 160ms ease-out, color 400ms ease, background-color 400ms ease, box-shadow 650ms ease, border-color 400ms ease; }
.power-button::after { content: ""; position: absolute; inset: -9px; border: 2px solid transparent; border-top-color: #dfd5ff; border-right-color: #dfd5ff55; border-radius: inherit; opacity: 0; transition: opacity 250ms ease; pointer-events: none; }
.power-button svg { width: 28px; height: 28px; }
.is-on .power-button { background: #f3f0ff; color: #514369; border-color: #f3f0ff; box-shadow: 0 0 0 8px #e7dcff0c, 0 0 36px #e7dcff25; }
.power-button:disabled { opacity: .5; }
.power-panel[aria-busy=true] .power-button { opacity: 1; animation: pending 1.4s ease-in-out infinite; }
.power-panel[aria-busy=true] .power-button::after { opacity: 1; animation: spin 1.1s linear infinite; }
.light-spectrum { display: flex; gap: 5px; margin-top: 32px; height: 3px; }
.light-spectrum span { flex: 1; border-radius: 3px; background: #656779; opacity: .4; transition: background-color 800ms ease, box-shadow 800ms ease, opacity 800ms ease; }
.is-on .light-spectrum span { opacity: .9; background: var(--light); box-shadow: 0 0 14px var(--light); }
.light-spectrum span:nth-child(1) { --light: #ff91b2; }
.light-spectrum span:nth-child(2) { --light: #edb48b; }
.light-spectrum span:nth-child(3) { --light: #c8a4ff; }
.light-spectrum span:nth-child(4) { --light: #8db5ff; }
.light-spectrum span:nth-child(5) { --light: #85dfd7; }
.status { display: flex; align-items: center; gap: 9px; max-height: 0; opacity: 0; overflow: hidden; font-size: 12px; line-height: 1.55; color: #e3e2f1; transition: max-height 350ms ease, opacity 250ms ease, margin-top 350ms ease; }
.status.visible { max-height: 160px; opacity: 1; margin-top: 22px; }
.status i { background: #a1a1b8; }
.status.warning i { background: #f0c889; }
.recovery { margin-top: 12px; padding: 14px; border: 1px solid #e3d5b9; border-radius: 14px; background: #faf5e9; animation: state-in 250ms ease both; }
.recovery-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.recovery button { min-height: 44px; padding: 10px 14px; background: #fffaf0; border: 1px solid #b7a783; border-radius: 8px; font-size: 13px; }
.recovery button:disabled { opacity: .5; }
details { font-size: 12px; color: #6d5b37; margin-top: 10px; overflow-wrap: anywhere; }
summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; }
details p { line-height: 1.6; margin: 0; }
.sources { border: 0; margin: 30px 0 20px; padding: 0; min-width: 0; }
legend { padding: 0; font-size: 13px; font-weight: 550; color: #616577; }
.source-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.source { position: relative; display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 20px; padding: 20px; min-height: 132px; width: 100%; border: 1px solid #dfe0ea; border-radius: 18px; background: #fefeff; box-shadow: 0 2px 0 #e6e3ed99; transition: background-color 180ms ease, border-color 180ms ease, box-shadow 160ms ease, transform 160ms ease-out; }
.source[aria-pressed=true] { border-color: #a296cf; background: #f0edf8; box-shadow: inset 0 2px 5px #75678e18; transform: translateY(1px); }
.source-icon { width: 38px; height: 38px; display: grid; place-items: center; background: #f0f0f6; border-radius: 11px; flex-shrink: 0; color: #73748a; transition: color 180ms ease, background-color 180ms ease; }
.source[aria-pressed=true] .source-icon { background: #e4def3; color: #706094; }
.source-icon svg { width: 22px; height: 22px; }
.source-title { font-size: 14px; font-weight: 550; }
.selection { position: absolute; top: 22px; right: 18px; width: 18px; height: 18px; border: 1px solid #d0ccdd; border-radius: 50%; display: grid; place-items: center; color: #fff; transition: background-color 250ms ease, border-color 250ms ease; }
.selection svg { width: 14px; height: 14px; opacity: 0; transition: opacity 180ms ease; }
.source[aria-pressed=true] .selection { background: #7d6d9e; border-color: #7d6d9e; }
.source[aria-pressed=true] .selection svg { opacity: 1; }
.sources:disabled .source { opacity: .6; cursor: default; }
.sources .source[aria-busy=true] { opacity: 1; transform: translateY(1px); box-shadow: inset 0 2px 5px #75678e18; }
.source[aria-busy=true] .selection { background: transparent; border-color: #7d6d9e transparent #7d6d9e55 transparent; animation: spin 1.1s linear infinite; }
.source[aria-busy=true] .selection svg { opacity: 0; }
.wled-link { margin-top: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; color: #68647d; padding: 18px 2px; border-top: 1px solid #dfe0ea; min-height: 56px; font-size: 12px; transition: color 200ms ease; }
.wled-link svg { width: 18px; height: 18px; transition: transform 300ms ease; }
.loading { text-align: center; margin: 25vh 20px; color: #717488; }
main > .intro, main > .power-panel { animation: state-in 300ms ease both; }
main > .power-panel { animation-delay: 60ms; }
main > .sources { animation: state-in 180ms ease both; }
@keyframes state-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes ambient { from { transform: translate(-2%, -1%) scale(1); } to { transform: translate(2%, 2%) scale(1.08); } }
@keyframes pending { 50% { box-shadow: 0 0 0 12px #e7dcff0c; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes connection-pending { 50% { opacity: .3; } }
@media (hover: hover) {
  .source:not(:disabled):hover { border-color: #a296cf; }
  .source[aria-pressed=false]:not(:disabled):hover { background: #f8f7fc; }
  .wled-link:hover { color: #262838; }
  .wled-link:hover svg { transform: translate(2px, -2px); }
  .power-button:not(:disabled):hover { border-color: #f3f0ff; }
}
.power-button:not(:disabled):active, .source:not(:disabled):active { transform: translateY(2px); box-shadow: inset 0 3px 8px #29263830; transition-duration: 70ms; }
@media (max-width: 380px) { main { width: calc(100% - 32px); padding-top: 22px; } .intro { margin-top: 30px; } .power-panel { padding: 26px 22px; } .power-heading { gap: 12px; } h2 { font-size: 40px; } .power-button { width: 64px; height: 64px; } .source { padding: 18px 14px; } .selection { right: 14px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
