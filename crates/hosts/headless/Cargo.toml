[package]
name = "prysm-headless"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Production host: device or remote capture into WLED, controlled from the web portal"

[dependencies]
prysm-host = { workspace = true, features = ["desktop"] }
prysm-capture-device.workspace = true

[dev-dependencies]
prysm-runtime.workspace = true
# The system tests stream as the TV does, also through the testkit's TLS proxy.
prysm-capture-remote = { workspace = true, features = ["testkit"] }
prysm-core.workspace = true
prysm-ports.workspace = true
prysm-settings-file.workspace = true
serde.workspace = true
prysm-testkit.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
