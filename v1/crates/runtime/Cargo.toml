[package]
name = "prysm-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The Prysm engine, session thread, builder and surfaces"

[features]
# Scripted fake adapters for tests and examples.
testkit = []
# `utoipa::ToSchema` for `NullSettings`, for the contract exporter.
schema = ["dep:utoipa"]

[dependencies]
prysm-ports.workspace = true
prysm-core.workspace = true
prysm-processor.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["time"] }
serde.workspace = true
utoipa = { workspace = true, optional = true }

[dev-dependencies]
# Enables the fakes for this crate's integration tests and examples.
prysm-runtime = { path = ".", features = ["testkit"] }
tokio = { workspace = true, features = ["time", "rt", "macros"] }

[lints]
workspace = true
