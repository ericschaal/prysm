# CI: the Cargo workspace (Cargo.toml), the npm workspace (frontend/), the
# packages and the repository-wide checks. The release workflow calls it (with
# `release: true` and the tag's commit, the image, .deb and IPKs are kept as
# artifacts for publishing), so a release is built only from a green run.
# No path filters: required checks must always report.
#
# Jobs:
# - `quality`: shell scripts, script tests, Markdown links, workflows.
# - `frontend`: lint, formatting, generated contracts, bundles and tests. The
#   hosts include! frontend/dist, so the Rust jobs download this bundle before
#   compiling. Codegen runs the Rust contract exporter, which is why this job
#   also needs Rust and libclang.
# - `rust` (Linux, macOS): formatting, clippy, tests, doctests; builds the e2e
#   binaries. `e2e`: the portal in Chromium and WebKit against them.
# - `webos-armv7`: lints (clippy -D warnings) every TV crate that compiles
#   without the webOS SDK, with Ubuntu's stock soft-float cross compiler (the
#   C++ in capture-webos-sys and OpenH264 only need a g++; Luna and VTCapture
#   are loaded at run time), and runs their unit tests under qemu-user. Only
#   prysm-webos-slim and prysm-h264-rvenc-sys (prysm-h264's `hardware`
#   feature) need the SDK: their GStreamer sys crates look up the sysroot's
#   GStreamer with pkg-config.
# - `webos-ipk`: installs the pinned SDK, checks the Luna bindings against its
#   headers, lints the SDK-only TV crates and builds both IPKs with
#   build-ipk.sh, which links against the sysroot and checks the binaries with
#   ipk.py.
# - `miri`: interprets webos-luna-sys's ownership and callback tests on the
#   x86-64 and armv7 targets, with a pinned nightly (its mock swaps dlopen for
#   a placeholder library under Miri).
# - `docker` (amd64, arm64): builds and smoke-tests the prysm-headless image,
#   checks both compose files, and builds, installs and purges the .deb.
#
# Not here: on-TV tests (native-smoke.py) need a TV.
name: CI
on:
  # A branch gets its results from its pull request (a draft one will do).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out; the triggering commit when empty
        type: string
        default: ''
      release:
        description: Keep the image, .deb and IPKs as artifacts for publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Not `github.workflow`: when a release workflow calls this, that is the caller's
  # name, and an identical group would deadlock the caller. A release run is
  # never cancelled.
  group: ci-${{ github.ref }}-${{ inputs.release && 'release' || 'check' }}
  cancel-in-progress: ${{ !inputs.release }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -x adapters/capture-device-sys/video_test.sh \
            packaging/debian/build-deb.sh packaging/debian/postinst \
            packaging/debian/prerm packaging/debian/postrm \
            packaging/docker/smoke.sh packaging/release/publish.sh \
            packaging/webos/build-ipk.sh packaging/webos/env.sh \
            packaging/webos/install-ipk.sh packaging/webos/linker.sh \
            packaging/webos/service/setup.sh \
            packaging/webos/tests/tv-acceptance.sh
      - name: Documentation checker tests and repository links
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 scripts/check-doc-links.py
      - name: GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # frontend/package.json engines: node >=24.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Rust and libclang for the contract exporter
        # prysm-capture-device-sys -> v4l2-sys-mit generates its bindings with bindgen.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev
          rustup update stable --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: frontend
      - run: npm --prefix frontend ci
      - name: Lint and formatting
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run format:check
      # Check before building: the build regenerates the contracts.
      - name: Generated contracts are current
        run: npm --prefix frontend run codegen:check
      - name: Build bundles and run frontend tests
        # `npm test` runs `npm run build` (codegen, typecheck, bundles, assets.rs) first.
        run: npm --prefix frontend test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  rust:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Update Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # prysm-capture-device-sys -> v4l2-sys-mit generates its bindings with bindgen.
        # OpenH264 builds without nasm (no assembly), as in the release image.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: rust
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Package file and ipk.py tests
        if: runner.os == 'Linux'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 packaging/webos/tests/test_ipk.py
      - name: Frontend bundle for the hosts' include!
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist
      # The file source's real-FFmpeg test skips without ffmpeg on PATH and its
      # filter needs FFmpeg 9+, which Ubuntu 24.04 does not ship.
      - name: Install FFmpeg 9+
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew install ffmpeg
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: FFmpeg is 9 or newer
        run: |
          ffmpeg -version | head -n 1
          major=$(ffmpeg -version | sed -n '1s/^ffmpeg version n\{0,1\}\([0-9][0-9]*\).*/\1/p')
          [ "${major:-0}" -ge 9 ]
      # --all-features costs nothing extra: the exporter already enables every schema feature.
      - name: Lint all targets
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test all targets
        run: cargo test --locked --workspace --all-targets --all-features
      # The `e2e` job runs the portal against these. Built by name: the test
      # run above leaves examples only under hashed file names.
      - name: Build the e2e binaries
        if: runner.os == 'Linux'
        run: >-
          cargo build --locked
          -p prysm-headless -p prysm-capture-remote --example test_sender
          && cargo build --locked -p prysm-headless
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: e2e-binaries
          path: |
            target/debug/prysm-headless
            target/debug/examples/test_sender
          if-no-files-found: error
          retention-days: 1
      # --all-targets skips doctests.
      - name: Doctests
        run: cargo test --locked --workspace --doc --all-features

  # The portal in Chromium and WebKit against a real prysm-headless per test
  # (frontend/e2e). Browsers are installed per run, as Playwright advises.
  e2e:
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Browsers
        run: npm --prefix frontend run e2e:install -- --with-deps
      - name: prysm-headless and the test sender
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-binaries
          path: ${{ runner.temp }}/e2e-bin
      # Artifacts do not keep the executable bit.
      - run: chmod +x "$RUNNER_TEMP/e2e-bin/prysm-headless" "$RUNNER_TEMP/e2e-bin/examples/test_sender"
      - name: Portal end-to-end tests
        env:
          PRYSM_HEADLESS_BIN: ${{ runner.temp }}/e2e-bin/prysm-headless
          PRYSM_TEST_SENDER_BIN: ${{ runner.temp }}/e2e-bin/examples/test_sender
        run: npm --prefix frontend run e2e
      # The HTML report, and traces and videos of failed or retried tests.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: frontend/.e2e
          include-hidden-files: true
          retention-days: 7

  webos-armv7:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABI_LINKER: arm-linux-gnueabi-gcc
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABI_RUNNER: qemu-arm -L /usr/arm-linux-gnueabi
      CC_armv7_unknown_linux_gnueabi: arm-linux-gnueabi-gcc
      CXX_armv7_unknown_linux_gnueabi: arm-linux-gnueabi-g++
      AR_armv7_unknown_linux_gnueabi: arm-linux-gnueabi-ar
      # As packaging/webos/env.sh sets them (without the SDK sysroot):
      # OpenH264's ARM assembly is NEON.
      CFLAGS_armv7_unknown_linux_gnueabi: -mfloat-abi=softfp -mfpu=neon
      CXXFLAGS_armv7_unknown_linux_gnueabi: -mfloat-abi=softfp -mfpu=neon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: ARM soft-float cross compiler and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-arm-linux-gnueabi qemu-user
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          rustup target add armv7-unknown-linux-gnueabi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: webos-armv7
      - name: Frontend bundle for prysm-webos's include!
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist
      # Not prysm-webos-slim or prysm-h264-rvenc-sys: they need the SDK
      # sysroot's GStreamer (webos-ipk lints them).
      - name: Lint the TV crates for armv7
        run: >-
          cargo clippy --locked --all-targets
          --target armv7-unknown-linux-gnueabi
          -p prysm-webos-link -p prysm-webos-service -p prysm-webos
          -p prysm-capture-webos -p prysm-capture-webos-sys -p prysm-webos-luna-sys
          -p prysm-capture-remote -p prysm-h264
          -- -D warnings
      # Library tests only: integration tests start the armv7 binaries
      # themselves, which needs binfmt_misc rather than the cargo runner.
      # Skipped test: qemu-user reports a successful spawn for a missing
      # program (it fails after the fork); the `rust` job runs it natively.
      - name: ABI, exception boundary, Luna wrapper and supervisor tests under qemu
        run: >-
          cargo test --locked --lib
          --target armv7-unknown-linux-gnueabi
          -p prysm-capture-webos-sys -p prysm-webos-luna-sys
          -p prysm-webos-link -p prysm-webos-service
          -- --skip launcher::tests::a_missing_program_fails_to_spawn

  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, armv7-unknown-linux-gnueabi]
    env:
      MIRI_TOOLCHAIN: nightly-2026-11-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install pinned Miri toolchain
        run: rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal --component miri,rust-src --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: miri-${{ matrix.target }}
      - name: Interpret Luna ownership and callback tests
        run: cargo +"$MIRI_TOOLCHAIN" miri test --locked -p prysm-webos-luna-sys --target ${{ matrix.target }}

  webos-ipk:
    # The SDK below is built for aarch64 hosts.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      WEBOS_SDK: ${{ github.workspace }}/.webos-sdk/arm-webos-linux-gnueabi_sdk-buildroot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: webOS build dependencies
        # libclang: the contract exporter (prysm-capture-device-sys -> v4l2-sys-mit) and
        # the Luna binding generator. ares-package: build-ipk.sh.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev file python3
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          rustup target add armv7-unknown-linux-gnueabi
          npm install --global @webos-tools/cli@3.2.6
      # The pinned webOS SDK (aarch64 build).
      - name: Install pinned webOS SDK
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/webos-sdk.tar.gz" \
            https://github.com/openlgtv/buildroot-nc4/releases/download/2026.08-webos/arm-webos-linux-gnueabi_sdk-buildroot-aarch64.tar.gz
          echo "3a9330f3789f8008ece7c8a48f58c3a71d0307a9a1f81896db938b785524c3ce  $RUNNER_TEMP/webos-sdk.tar.gz" | sha256sum --check
          mkdir -p "$(dirname "$WEBOS_SDK")"
          tar -xzf "$RUNNER_TEMP/webos-sdk.tar.gz" -C "$(dirname "$WEBOS_SDK")"
          "$WEBOS_SDK/relocate-sdk.sh"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: webos-ipk-2026.08-webos
      - name: Luna and GLib bindings match the SDK headers
        run: >-
          cargo run --locked -p prysm-webos-luna-sys
          --features codegen --bin generate-luna-bindings -- --check
      - name: Frontend bundles
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Fetch crates
        # build-ipk.sh builds with --offline.
        run: cargo fetch --locked
      # prysm-webos-slim enables prysm-h264's `hardware` feature, so this also
      # lints the arm-only GStreamer code in prysm-h264-rvenc-sys.
      - name: Lint the SDK-only TV crates for armv7
        run: |
          . packaging/webos/env.sh
          cargo clippy --locked --offline --all-targets \
            --target armv7-unknown-linux-gnueabi \
            -p prysm-webos-slim -p prysm-h264-rvenc-sys -p prysm-h264 -- -D warnings
      - name: Build and verify both IPKs
        run: |
          packaging/webos/build-ipk.sh full --out "$RUNNER_TEMP/ipk/full"
          packaging/webos/build-ipk.sh slim --out "$RUNNER_TEMP/ipk/slim"
      # io.prysm.tv-full_<version>_all.ipk and io.prysm.tv-slim_…: one artifact each.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release || github.event_name != 'pull_request'
        with:
          name: prysm-tv-ipk-full
          path: ${{ runner.temp }}/ipk/full/*.ipk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release || github.event_name != 'pull_request'
        with:
          name: prysm-tv-ipk-slim
          path: ${{ runner.temp }}/ipk/slim/*.ipk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: runtime
          load: true
          tags: prysm-headless:local
          labels: org.opencontainers.image.revision=${{ inputs.ref || github.sha }}
          cache-from: type=gha,scope=prysm-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=prysm-${{ matrix.arch }}
      - name: Smoke-test image
        run: packaging/docker/smoke.sh prysm-headless:local
      - name: Compose files
        run: |
          docker compose -f packaging/docker/compose.yaml config --quiet
          docker compose -f packaging/docker/compose.truenas.yaml config --quiet
      - name: Build Debian package
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: deb
          outputs: type=local,dest=${{ runner.temp }}/deb
          cache-from: type=gha,scope=prysm-${{ matrix.arch }}
      - name: Inspect, install and purge the Debian package
        env:
          DEB_DIRECTORY: ${{ runner.temp }}/deb
          ARCH: ${{ matrix.arch }}
        run: |
          deb=$(ls "$DEB_DIRECTORY"/prysm-headless_*_"$ARCH".deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          dpkg-deb --field "$deb" Conflicts | grep -qw prysm-led
          dpkg-deb --contents "$deb" | grep -q '/usr/share/doc/prysm-headless/LICENSE.openh264$'
          # No systemd in the container: checks dependencies, user and layout.
          docker run --rm -v "$DEB_DIRECTORY:/deb:ro" debian:bookworm-slim sh -euc '
            apt-get update -qq
            apt-get install -y -qq /deb/prysm-headless_*.deb >/dev/null
            id prysm
            id -nG prysm | grep -qw video
            /usr/bin/prysm-headless --help >/dev/null
            apt-get purge -y -qq prysm-headless >/dev/null
            test ! -e /usr/bin/prysm-headless'
      - name: Export image
        if: inputs.release
        run: docker image save --output "${{ runner.temp }}/prysm-headless-${{ matrix.arch }}.tar" prysm-headless:local
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release
        with:
          name: prysm-headless-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/prysm-headless-${{ matrix.arch }}.tar
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release
        with:
          name: prysm-headless-deb-${{ matrix.arch }}
          path: ${{ runner.temp }}/deb/*.deb
          retention-days: 7
          if-no-files-found: error
