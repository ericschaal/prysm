[workspace]
resolver = "3"
members = [
    "apps/prysm",
    "apps/prysm-web",
    "crates/capture/prysm-capture",
    "crates/capture/prysm-webos-protocol",
    "crates/capture/webos-capture",
    "crates/processing/prysm-processor",
    "crates/common/prysm-core",
    "crates/common/prysm-contract",
    "crates/common/prysm-api",
    "crates/rendering/prysm-renderer-desktop",
    "crates/rendering/prysm-renderer-wled",
]

[workspace.package]
license = "Apache-2.0"

# The video pipeline does per-pixel work on full HD frames; unoptimized dev
# builds make it burn >100% CPU. Lightly optimize workspace code and fully
# optimize dependencies (yuv, epaint) while keeping debug assertions on.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.webos]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_errors_doc = "allow"

[workspace.dependencies]
actix = "0.13"
tokio = { version = "1" }
tokio-util = { version = "0.7" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
anyhow = { version = "1.0" }
thiserror = "2"
futures = { version = "0.3" }
yuv = { version = "0.8" }
