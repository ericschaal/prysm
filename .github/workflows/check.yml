name: Check and package
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rust formatting
        run: |
          rustup update stable --no-self-update
          rustup component add rustfmt --toolchain stable
          cargo +stable fmt --all -- --check
      - name: Shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck scripts/build-deb.sh packaging/debian/postinst packaging/debian/postrm packaging/debian/prerm crates/capture/prysm-capture/video_test.sh crates/capture/webos-capture/build-webos.sh crates/capture/webos-capture/webos-linker.sh crates/capture/webos-service/build-webos.sh packaging/webos/build-ipk.sh packaging/webos/service/setup.sh
      - name: GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/prysm-web/control-ui/package-lock.json
      - name: Update Rust
        run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: frontend
      - name: Install frontend dependencies
        run: npm ci --prefix apps/prysm-web/control-ui
      - name: webOS service lifecycle and Luna setup
        run: |
          node --test packaging/webos/tests/*.test.js
          python3 -m unittest discover -s packaging/webos/tests
      - name: Generated API, TypeScript, production bundle, UI and proxy tests
        run: npm test --prefix apps/prysm-web/control-ui

  webos-arm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABI_LINKER: arm-linux-gnueabi-gcc
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABI_RUNNER: qemu-arm -L /usr/arm-linux-gnueabi
      CXX_armv7_unknown_linux_gnueabi: arm-linux-gnueabi-g++
    steps:
      - uses: actions/checkout@v4
      - name: ARM soft-float toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-arm-linux-gnueabi qemu-user
          rustup update stable --no-self-update
          rustup target add armv7-unknown-linux-gnueabi --toolchain stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: webos-arm
      - name: ARM32 native ABI, exception boundary, pixels and transport tests
        run: cargo +stable test --locked -p prysm-webos-capture -p prysm-webos-protocol -p prysm-webos-service --target armv7-unknown-linux-gnueabi

  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, armv7-unknown-linux-gnueabi]
    env:
      MIRI_TOOLCHAIN: nightly-2026-11-01
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Miri toolchain
        run: rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal --component miri,rust-src --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri-${{ matrix.target }}
      - name: Interpret Luna ownership and callback tests
        run: cargo +"$MIRI_TOOLCHAIN" miri test --locked -p prysm-webos-service --target ${{ matrix.target }}

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/prysm-web/control-ui/package-lock.json
      - name: Update Rust
        run: |
          rustup update stable --no-self-update
          rustup component add clippy --toolchain stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev libudev-dev pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust
      - name: Headless workspace tests and doctests
        run: cargo +stable test --locked --workspace --no-default-features --exclude prysm-renderer-desktop
      - name: Desktop workspace tests and doctests
        run: cargo +stable test --locked --workspace --all-features
      - name: Compile and lint all targets, including examples
        run: |
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo +stable clippy --locked --workspace --all-targets --no-default-features -- -D warnings
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo +stable doc --locked --workspace --all-features --no-deps
      - name: Install FFmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Real FFmpeg playback and controller tests
        if: runner.os == 'macOS'
        run: cargo +stable test --locked -p prysm --all-features --lib --test controller -- --ignored

  debian-arm64:
    runs-on: ubuntu-24.04-arm
    container: rust:bookworm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/prysm-web/control-ui/package-lock.json
      - name: Linux build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends clang libclang-dev libudev-dev pkg-config dpkg-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: debian-arm64
      - name: Packaging tool
        run: cargo install cargo-deb --version 3.8.0 --locked
      - name: Verify and build package
        run: ./scripts/build-deb.sh
      - name: Generated contracts must be committed
        # The container user differs from the checkout owner; trust only this workspace.
        run: git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code HEAD -- apps/prysm-web/control-ui/openapi.json apps/prysm-web/control-ui/api.generated.ts
      - name: Inspect package and verify configuration lifecycle
        run: |
          dpkg-deb --info target/debian/*.deb
          dpkg-deb --contents target/debian/*.deb
          apt-get install -y ./target/debian/*.deb
          runuser -u prysm -- prysm --config /etc/prysm/prysm.toml check
          test "$(stat -c '%U:%G %a' /etc/prysm)" = "prysm:prysm 700"
          test "$(stat -c '%U:%G %a' /etc/prysm/prysm.toml)" = "prysm:prysm 600"
          echo '# Package upgrade must preserve local settings' >> /etc/prysm/prysm.toml
          sha256sum /etc/prysm/prysm.toml > /tmp/prysm-config.sha256
          apt-get install -y --reinstall ./target/debian/*.deb
          sha256sum --check /tmp/prysm-config.sha256
          apt-get remove -y prysm-led
          sha256sum --check /tmp/prysm-config.sha256
          apt-get purge -y prysm-led
          test ! -e /etc/prysm/prysm.toml
          test ! -d /etc/prysm
      - uses: actions/upload-artifact@v4
        with:
          name: prysm-debian-arm64
          path: target/debian/*.deb
          if-no-files-found: error
