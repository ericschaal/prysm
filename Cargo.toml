[workspace]
resolver = "3"
default-members = ["apps/prysm"]
members = [
    "xtask",
    "apps/prysm",
    "apps/prysm/runtime",
    "apps/prysm-webos-capture",
    "apps/prysm-webos-capture/local",
    "apps/prysm-webos-service",
    "crates/web/prysm-web",
    "crates/capture/prysm-capture",
    "crates/capture/prysm-webos-protocol",
    "crates/processing/prysm-processor",
    "crates/common/prysm-core",
    "crates/common/prysm-contract",
    "crates/common/prysm-api",
    "crates/common/prysm-metrics",
    "crates/rendering/prysm-renderer-wled",
]

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/ericschaal/prysm"
readme = "README.md"
keywords = ["ambilight", "lighting", "video", "wled"]
categories = ["multimedia::video"]

# The video pipeline does per-pixel work on full HD frames; unoptimized dev
# builds make it burn >100% CPU. Lightly optimize workspace code and fully
# optimize dependencies (yuv, codecs) while keeping debug assertions on.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.webos]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_errors_doc = "allow"

[workspace.dependencies]
anyhow = "=1.0.104"
atomic-write-file = "=0.3.1"
av-foundation = "=0.8.1"
axum = "=0.8.9"
bindgen = { version = "=0.73.2", default-features = false, features = ["runtime"] }
cc = "=1.10.0"
clap = "=4.6.7"
core-foundation = { version = "=0.10.1", default-features = false }
core-media = { version = "=0.8.1", default-features = false }
core-video = { version = "=0.6.1", default-features = false }
ddp-rs = "=1.3.0"
dispatch2 = "=0.3.1"
futures = "=0.3.34"
gstreamer = "=0.25.4"
gstreamer-app = "=0.25.2"
gstreamer-video = "=0.25.4"
gstreamer-allocators = "=0.25.4"
h264-reader = "=0.9.0"
libc = "=0.2.191"
rustix = { version = "=1.1.6", default-features = false }
libloading = "=0.9.0"
lz4_flex = { version = "=0.14.0", default-features = false }
memmap2 = "=0.9.12"
mime_guess = "=2.0.5"
nix = "=0.31.3"
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
openh264 = "=0.9.9"
prometheus-client = "=0.25.2"
rayon = "=1.12.0"
reqwest = { version = "=0.13.5", default-features = false }
rust-embed = "=8.13.0"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "tls12"] }
serde = "=1.0.229"
serde_json = "=1.0.154"
signal-hook = "=0.4.6"
sysinfo = { version = "=0.40.1", default-features = false }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tiny_http = { version = "=0.12.0", default-features = false }
tokio = "=1.54.1"
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-native-roots"] }
tokio-util = "=0.7.20"
tower = "=0.5.3"
tower-http = "=0.7.1"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
url = "=2.5.8"
utoipa = "=6.0.0"
utoipa-axum = "=0.3.0"
uuid = "=1.29.0"
yuv = { version = "=0.8.20", default-features = false }

# shortcut: Axum 0.8.9 still uses tungstenite 0.29; remove when a release includes 0.30.
[patch.crates-io]
axum = { git = "https://github.com/tokio-rs/axum", rev = "dcfd5e3442b2a8b021ccc954501157ebd602d2a2" }
