[package]
name = "prysm"
version = "0.2.1"
edition = "2024"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Capture and process video for WLED with browser preview"

[package.metadata.deb]
license-file = "../../LICENSE"
name = "prysm-led"
maintainer = "Eric Schaal <eric@schaal.dev>"
depends = "$auto, systemd, init-system-helpers"
section = "video"
priority = "optional"
maintainer-scripts = "../../packaging/debian"
assets = [
    ["target/release/prysm", "usr/bin/prysm", "755"],
    ["../../packaging/debian/prysm.conf", "usr/lib/sysusers.d/prysm.conf", "644"],
    ["../../packaging/debian/README.md", "usr/share/doc/prysm-led/README.md", "644"],
]

[[package.metadata.deb.systemd-units]]
unit-name = "prysm"
enable = false
start = false
stop-on-upgrade = false
restart-after-upgrade = true

[lints]
workspace = true

[dependencies]
prysm-metrics = { path = "../../crates/common/prysm-metrics" }
clap = { workspace = true, features = ["derive", "env"] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
futures.workspace = true
prysm-capture = { path = "../../crates/capture/prysm-capture" }
prysm-core = { path = "../../crates/common/prysm-core" }
prysm-processor = { path = "../../crates/processing/prysm-processor" }
prysm-renderer-wled = { path = "../../crates/rendering/prysm-renderer-wled" }
tokio-util.workspace = true
tokio-tungstenite.workspace = true

prysm-contract = { path = "../../crates/common/prysm-contract" }

axum = { workspace = true, features = ["ws"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
rustls.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
serde_json.workspace = true
prysm-api = { path = "../../crates/common/prysm-api" }
prysm-web = { path = "../../crates/web/prysm-web" }
tower-http = { workspace = true, features = ["csrf"] }
atomic-write-file.workspace = true
tempfile.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
prysm-webos-protocol = { path = "../../crates/capture/prysm-webos-protocol" }
tower = { workspace = true, features = ["util"] }
