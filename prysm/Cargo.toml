[package]
name = "prysm"
version = "0.1.0"
edition = "2024"
default-run = "prysm"
description = "Process device or file video for WLED or an on-screen preview"

[package.metadata.deb]
name = "prysm-led"
maintainer = "Eric Schaal <eric@schaal.dev>"
depends = "$auto, systemd, init-system-helpers, polkitd"
section = "video"
priority = "optional"
maintainer-scripts = "debian"
assets = [
    ["target/release/prysm", "usr/bin/prysm", "755"],
    ["target/release/prysm-control", "usr/bin/prysm-control", "755"],
    ["debian/prysm-control.service", "usr/lib/systemd/system/prysm-control.service", "644"],
    ["debian/prysm-control.sysusers", "usr/lib/sysusers.d/prysm-control.conf", "644"],
    ["debian/prysm-control.rules", "usr/share/polkit-1/rules.d/prysm-control.rules", "644"],
    ["debian/control.toml", "etc/prysm/control.toml", "644"],
    ["debian/prysm.toml", "etc/prysm/prysm.toml", "644"],
    ["debian/README.md", "usr/share/doc/prysm-led/README.md", "644"],
]

[package.metadata.deb.systemd-units]
unit-name = "prysm-led"
enable = false
start = false

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
futures.workspace = true
prysm-capture = { path = "../prysm-capture" }
prysm-core = { path = "../prysm-core" }
prysm-processor = { path = "../prysm-processor" }
desktop-renderer = { path = "../renderers/desktop-renderer" }
led-renderer = { path = "../renderers/led-renderer" }
tokio-util.workspace = true

axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
