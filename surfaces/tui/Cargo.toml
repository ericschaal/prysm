[package]
name = "prysm-surface-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Terminal surface: live preview and lighting commands"

[dependencies]
prysm-ports.workspace = true
prysm-runtime.workspace = true
prysm-core.workspace = true
futures.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
# Level-triggered /dev/tty polling: bounded reads never strand input after a scroll burst.
crossterm = { version = "0.28", default-features = false, features = ["events", "use-dev-tty"] }

[dev-dependencies]
prysm-runtime = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["time", "rt", "macros"] }
tempfile.workspace = true

[lints]
workspace = true
