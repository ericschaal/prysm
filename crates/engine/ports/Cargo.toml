[package]
name = "prysm-ports"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Blocking adapter ports, settings and snapshot types for the Prysm runtime"

[features]
# Schemas for port wire types used by the contract exporter.
schema = ["dep:utoipa"]
# `Hangup::waits`, so a test cuts only a call that waits.
testkit = []

[dependencies]
prysm-core.workspace = true
num-integer = "0.1"
thiserror.workspace = true
# A socket registered before it connects, so a `Hangup` can shut it down.
socket2.workspace = true
# poll(2) for that connect.
nix = { workspace = true, features = ["poll"] }
strum.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
utoipa = { workspace = true, optional = true }

[lints]
workspace = true
