name: Documentation links

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/users/examples/*.toml'
      - 'scripts/check-doc-links.py'
      - 'scripts/tests/test_doc_links.py'
      - '.github/workflows/documentation.yml'
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's python3 (3.12 on ubuntu-24.04).
      - name: Link checker regression tests
        run: python3 -m unittest discover -s scripts/tests
      - name: Repository paths, images and anchors
        run: python3 scripts/check-doc-links.py
      - name: Public URLs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/check-doc-links.py --external
