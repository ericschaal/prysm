version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
  # The acceptance runner's locked environment (scripts/acceptance/uv.lock).
  - package-ecosystem: uv
    directory: /scripts/acceptance
    schedule:
      interval: weekly
    groups:
      acceptance-runner:
        patterns: ['*']
