services:
  prysm:
    image: ghcr.io/ericschaal/prysm:0.2.1 # x-release-please-version
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 90s
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - prysm-config:/config

volumes:
  prysm-config:
