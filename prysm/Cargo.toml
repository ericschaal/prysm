[package]
name = "prysm"
version = "0.1.0"
edition = "2024"
default-run = "prysm"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
futures.workspace = true
prysm-capture = { path = "../prysm-capture" }
prysm-core = { path = "../prysm-core" }
prysm-processor = { path = "../prysm-processor" }
desktop-renderer = { path = "../renderers/desktop-renderer" }
led-renderer = { path = "../renderers/led-renderer" }
tokio-util.workspace = true
