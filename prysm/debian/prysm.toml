# Choose device/file input and wled/egui output.
brightness_percent = 80

# Color samples per 1000 pixels of cropped edge length. Defaults to 128.
sample_density = 128

# Camera capture / decoded video size [width, height]. Defaults to [640, 360].
capture_resolution = [640, 360]

# Screen edges viewed from the front; wiring starts at bottom-left and goes up.
[output]
type = "wled"
address = "wled.local:4048"
# Maximum WLED sends per second; positive integer, defaults to 30.
refresh_rate_hz = 50

[output.leds]
top = 51
right = 31
bottom = 49
left = 31

[input]
type = "device"
# Prefer a stable /dev/v4l/by-id/... path if the capture device provides one.
device = "/dev/video0"
