[package]
name = "prysm-webos-slim"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TV worker (slim): webOS capture forwarded to a headless Prysm, run by prysm-webos-service"

[dependencies]
prysm-webos-link = { workspace = true, features = ["worker"] }
prysm-core.workspace = true
prysm-ports.workspace = true
prysm-runtime = { workspace = true, features = ["logging"] }
prysm-capture-webos.workspace = true
prysm-capture-remote.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
prysm-runtime = { workspace = true, features = ["testkit"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "rt", "macros"] }

[lints]
workspace = true
