[package]
name = "prysm-webos-local"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Experimental on-TV capture, processing and WLED output"

[[bin]]
name = "prysm-webos-local"
path = "../src/local.rs"

[features]
embedded-prysm = [
    "prysm-webos-protocol/embedded-prysm",
    "dep:prysm-runtime",
    "dep:tokio",
    "dep:tokio-util",
    "dep:futures",
    "nix/net",
    "nix/socket",
]
webos-neon = ["dep:rayon"]

[dependencies]
prysm-runtime = { path = "../../prysm/runtime", default-features = false, optional = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"], optional = true }
tokio-util = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
anyhow.workspace = true
libc.workspace = true
libloading.workspace = true
nix = { workspace = true, features = ["fs", "poll", "signal", "user"] }
prysm-contract = { path = "../../../crates/common/prysm-contract" }
prysm-core = { path = "../../../crates/common/prysm-core" }
prysm-metrics = { path = "../../../crates/common/prysm-metrics" }
prysm-processor = { path = "../../../crates/processing/prysm-processor", features = ["parallel-projection"] }
prysm-renderer-wled = { path = "../../../crates/rendering/prysm-renderer-wled" }
prysm-webos-protocol = { path = "../../../crates/capture/prysm-webos-protocol" }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
yuv = { workspace = true, features = ["rayon"] }

[target.'cfg(target_arch = "arm")'.dependencies]
rayon = { workspace = true, optional = true }

[dev-dependencies]
nix = { workspace = true, features = ["pthread"] }

[build-dependencies]
cc.workspace = true

[lints]
workspace = true
