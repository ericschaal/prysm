[package]
name = "prysm-webos-capture"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native webOS video capture sender for Prysm"

[features]
hardware-h264 = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video", "dep:gstreamer-allocators"]

[dependencies]
prysm-metrics = { path = "../../common/prysm-metrics" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true
libloading.workspace = true
memmap2.workspace = true
nix = { workspace = true, features = ["poll", "user", "fs", "signal"] }
serde_json.workspace = true
prysm-webos-protocol = { path = "../prysm-webos-protocol", features = ["h264"] }
yuv.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }
gstreamer-allocators = { workspace = true, optional = true }

[dev-dependencies]
nix = { workspace = true, features = ["socket", "pthread"] }

[build-dependencies]
cc.workspace = true

[lints]
workspace = true
