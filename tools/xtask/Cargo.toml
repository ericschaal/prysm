[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "cargo xtask: one entry point for codegen, checks and build artifacts"

# Must build on a fresh checkout: no crate that include!s frontend/dist.
[dependencies]
anyhow = "1"
