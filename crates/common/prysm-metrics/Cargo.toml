[package]
name = "prysm-metrics"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Opt-in Prometheus telemetry for Prysm nodes"

[dependencies]
anyhow.workspace = true
prysm-webos-protocol = { path = "../../capture/prysm-webos-protocol" }
prometheus-client = "0.25"
sysinfo = { version = "0.37", default-features = false, features = ["system", "network"] }
tiny_http = { version = "0.12", default-features = false }

[lints]
workspace = true
