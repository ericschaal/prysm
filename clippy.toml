# Existing transitive version splits in the capture and HTTP dependency trees.
# Keep multiple_crate_versions enabled for newly duplicated crate families.
# Recheck with cargo tree --locked --all-features --target all --duplicates on upgrades.
# Axum WebSocket (SHA-1), embedded assets (SHA-2), and reqwest currently select
# different crypto/base64/rand generations; these are transitive splits.
allowed-duplicate-crates = [
    "base64",
    "block-buffer",
    "cpufeatures",
    "crypto-common",
    "digest",
    "rand_core",
    "rand",
    "bitflags",
    "block2",
    "calloop",
    "calloop-wayland-source",
    "core-foundation",
    "foldhash",
    "getrandom",
    "hashbrown",
    "itertools",
    "jni-sys",
    "libloading",
    "linux-raw-sys",
    "miniz_oxide",
    "nom",
    "objc2",
    "objc2-app-kit",
    "objc2-foundation",
    "objc2-metal",
    "objc2-quartz-core",
    "objc2-ui-kit",
    "r-efi",
    "redox_syscall",
    "rustc-hash",
    "rustix",
    "shlex",
    "smithay-client-toolkit",
    "syn",
    "thiserror",
    "thiserror-impl",
    "tower-http",
    "windows-sys",
]
