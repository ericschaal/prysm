# Requires a desktop-enabled build and FFmpeg 9+; replace the video path.
revision = "0"
source = "prysm"

[web]
listen = "127.0.0.1:8787"
allowed_hosts = ["localhost:8787", "127.0.0.1:8787"]

[input]
type = "file"
path = "/absolute/path/to/your/video.mp4"
capture_resolution = [640, 360]
refresh_rate_hz = 30

[output]
type = "egui"

[processing]
brightness_percent = 80
shadow_lift_percent = 0
smoothing_seconds = 0.1
sample_density = 128
spatial_reach_percent = 10
remove_black_bars = true
