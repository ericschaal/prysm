name: Check and package
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  debian-arm64:
    runs-on: ubuntu-24.04-arm
    container: rust:bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/prysm-web/control-ui/package-lock.json
      - name: Linux build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends clang libclang-dev libudev-dev pkg-config dpkg-dev
      - name: Packaging tool
        run: cargo install cargo-deb --version 3.8.0 --locked
      - name: Verify and build package
        run: ./scripts/build-deb.sh
      - name: Generated contracts must be committed
        run: git diff --exit-code -- apps/prysm-web/control-ui/openapi.json apps/prysm-web/control-ui/api.generated.ts
      - name: Formatting
        run: rustup component add rustfmt && cargo fmt --all -- --check
      - name: Inspect package and validate installation config
        run: |
          dpkg-deb --info target/debian/*.deb
          dpkg-deb --contents target/debian/*.deb
          apt-get install -y ./target/debian/*.deb
          prysm --config /var/lib/prysm-control/prysm.toml check
      - uses: actions/upload-artifact@v4
        with:
          name: prysm-debian-arm64
          path: target/debian/*.deb

  desktop-and-playback:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/prysm-web/control-ui/package-lock.json
      - name: Update Rust
        run: rustup update stable --no-self-update
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Desktop build and workspace tests
        run: cargo +stable test --locked --workspace --features prysm/desktop
      - name: Real FFmpeg playback and controller tests
        run: cargo +stable test --locked -p prysm --features desktop --lib --test controller -- --ignored
