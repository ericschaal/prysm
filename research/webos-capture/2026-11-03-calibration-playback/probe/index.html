<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prysm calibration playback check</title>
<style>
html,body { margin:0; width:100%; height:100%; background:#000; color:#fff; font:32px sans-serif }
video { position:absolute; inset:0; width:100%; height:100%; object-fit:fill }
section { position:absolute; inset:0; padding:100px; background:#171921 }
button { font:inherit; padding:20px; margin:15px; border:4px solid transparent }
button:focus { border-color:#b09aff }
[hidden] { display:none }
</style>
</head>
<body>
<video id="pattern" muted loop playsinline aria-label="Calibration response pattern"></video>
<section id="menu">
<h1>Prysm calibration playback check</h1>
<p>Play the supplied gray and color video. Press Back to exit playback.</p>
<p id="status" role="status">This checks video capture; it does not save a calibration.</p>
<button id="start">Play response sequence</button>
<button id="gray">Hold light gray</button>
<button id="exit">Exit</button>
</section>
<script src="probe.js"></script>
</body>
</html>
