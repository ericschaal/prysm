<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">Prysm — beyond the screen</title>
  <desc id="desc">In a dark room, a television shows a sunset over a lake. LED light behind it throws the picture's colours onto the wall: warm pink on the left, violet above, blue on the right and teal below.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#2a2a7a"/><stop offset=".45" stop-color="#7d4fc4"/><stop offset=".8" stop-color="#f76aa0"/><stop offset="1" stop-color="#ffb07c"/></linearGradient>
    <linearGradient id="dusk" x2="1"><stop offset=".35" stop-color="#2447c9" stop-opacity="0"/><stop offset="1" stop-color="#2447c9" stop-opacity=".75"/></linearGradient>
    <linearGradient id="water" x2="0" y2="1"><stop stop-color="#8a62cf"/><stop offset=".4" stop-color="#3d8fd0"/><stop offset="1" stop-color="#18b9ad"/></linearGradient>
    <linearGradient id="top" x2="1"><stop stop-color="#e85aa8"/><stop offset=".4" stop-color="#8f5cf0"/><stop offset="1" stop-color="#3a66f0"/></linearGradient>
    <linearGradient id="bottom" x2="1"><stop stop-color="#e06aa0"/><stop offset=".35" stop-color="#2fc4b8"/><stop offset="1" stop-color="#22a6c9"/></linearGradient>
    <linearGradient id="left" x2="0" y2="1"><stop stop-color="#b455d8"/><stop offset=".6" stop-color="#ff6a9c"/><stop offset="1" stop-color="#ff9a78"/></linearGradient>
    <linearGradient id="right" x2="0" y2="1"><stop stop-color="#3f5cf2"/><stop offset=".6" stop-color="#3b7fe8"/><stop offset="1" stop-color="#22a6c9"/></linearGradient>
    <linearGradient id="word" x2="1"><stop stop-color="#ff8fb4"/><stop offset=".45" stop-color="#b79bff"/><stop offset="1" stop-color="#7fd9e0"/></linearGradient>
    <radialGradient id="sun"><stop stop-color="#fff1dc"/><stop offset=".55" stop-color="#ffd9b8"/><stop offset="1" stop-color="#ffc59c"/></radialGradient>
    <radialGradient id="sunglow"><stop stop-color="#ffd0a8" stop-opacity=".7"/><stop offset="1" stop-color="#ffd0a8" stop-opacity="0"/></radialGradient>
    <filter id="near" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="far" x="-1.5" y="-1.5" width="4" height="4"><feGaussianBlur stdDeviation="70"/></filter>
    <clipPath id="room"><rect width="1280" height="680" rx="28"/></clipPath>
    <clipPath id="picture"><rect x="600" y="190" width="556" height="326" rx="6"/></clipPath>
  </defs>
  <rect width="1280" height="680" rx="28" fill="#0d0d15"/>
  <g clip-path="url(#room)">
    <g filter="url(#far)" opacity=".8">
      <rect x="540" y="200" width="90" height="306" fill="url(#left)"/>
      <rect x="1126" y="200" width="90" height="306" fill="url(#right)"/>
      <rect x="610" y="126" width="536" height="90" fill="url(#top)"/>
      <rect x="610" y="490" width="536" height="90" fill="url(#bottom)"/>
    </g>
    <g filter="url(#near)">
      <rect x="566" y="196" width="50" height="314" fill="url(#left)"/>
      <rect x="1140" y="196" width="50" height="314" fill="url(#right)"/>
      <rect x="606" y="156" width="544" height="50" fill="url(#top)"/>
      <rect x="606" y="500" width="544" height="50" fill="url(#bottom)"/>
    </g>
  </g>
  <rect x="588" y="178" width="580" height="350" rx="14" fill="#07070b"/>
  <g clip-path="url(#picture)">
    <rect x="600" y="190" width="556" height="216" fill="url(#sky)"/>
    <rect x="600" y="190" width="556" height="216" fill="url(#dusk)"/>
    <circle cx="724" cy="346" r="92" fill="url(#sunglow)"/>
    <circle cx="724" cy="346" r="30" fill="url(#sun)"/>
    <path d="M600 372 664 318l52 46 70-74 78 82 62-40 96 58 60-52 74 62v48H600Z" fill="#5a3f9e"/>
    <path d="M600 398 690 352l84 44 96-60 110 62 92-42 84 46v20H600Z" fill="#2c2466"/>
    <rect x="600" y="404" width="556" height="112" fill="url(#water)"/>
    <g stroke="#ffd3c4" stroke-linecap="round" stroke-width="2" opacity=".55">
      <path d="M716 418h52M704 434h78M724 450h40M708 468h66M728 486h30"/>
    </g>
    <g stroke="#fff" stroke-linecap="round" stroke-width="1.5" opacity=".22">
      <path d="M890 426h96M934 446h46M878 474h58M1040 432h70M1010 462h84M940 496h70"/>
    </g>
    <path d="M600 462 656 470l44 46H600ZM1156 430 1100 468l-70 48h126Z" fill="#17143c"/>
  </g>
  <path d="m690 528-16 34h14l22-34ZM1066 528l16 34h-14l-22-34Z" fill="#07070b"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(64 57)" fill="none" stroke="#f3f1fa" stroke-linejoin="round">
      <path d="m16 3 13 24H3L16 3Z" stroke-width="2"/><path d="m16 3 4 24M3 27l15-12 11 12" stroke-width="1.5"/>
    </g>
    <text x="109" y="84" fill="#f3f1fa" font-size="32" font-weight="700" letter-spacing="-1.6">prysm<tspan fill="#b79bff">.</tspan></text>
    <text x="59" y="330" fill="#f3f1fa" font-size="76" font-weight="500" letter-spacing="-4">Beyond</text>
    <text x="59" y="414" fill="#f3f1fa" font-size="76" font-weight="500" letter-spacing="-4">the <tspan fill="url(#word)">screen.</tspan></text>
    <text x="64" y="470" fill="#a9a6ba" font-size="20">LED strips that follow your picture.</text>
    <text x="64" y="612" fill="#77748a" font-size="13" letter-spacing=".4">Capture card or LG TV  ·  WLED  ·  runs on your own network</text>
  </g>
</svg>
