[package]
name = "prysm-capture-webos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "LG webOS TV video capture as a blocking Prysm frame source"

[features]
# `utoipa::ToSchema` for the settings, for the contract exporter.
schema = ["dep:utoipa"]

[dependencies]
prysm-core.workspace = true
prysm-ports.workspace = true
# `Video`, the readiness the supervisor sends (protocol types only).
prysm-webos-link.workspace = true
serde.workspace = true
tracing.workspace = true
nix = { version = "0.31", features = ["fs", "signal", "user"] }
# FFI lives in its own crate so this one stays under the workspace's `unsafe_code = "forbid"`.
prysm-capture-webos-sys = { path = "../capture-webos-sys" }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
