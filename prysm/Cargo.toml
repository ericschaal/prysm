[package]
name = "prysm"
version = "0.1.0"
edition = "2024"
default-run = "prysm"
description = "Stream capture-device colors to WLED over DDP"

[package.metadata.deb]
name = "prysm-led"
maintainer = "Eric Schaal <eric@schaal.dev>"
depends = "$auto, systemd, init-system-helpers"
section = "video"
priority = "optional"
maintainer-scripts = "debian"
assets = [
    ["target/release/led", "usr/bin/prysm-led", "755"],
    ["debian/led.toml", "etc/prysm/led.toml", "644"],
    ["debian/README.md", "usr/share/doc/prysm-led/README.md", "644"],
]

[package.metadata.deb.systemd-units]
unit-name = "prysm-led"
enable = false
start = false

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
futures.workspace = true
prysm-capture = { path = "../prysm-capture" }
prysm-core = { path = "../prysm-core" }
prysm-processor = { path = "../prysm-processor" }
desktop-renderer = { path = "../renderers/desktop-renderer" }
led-renderer = { path = "../renderers/led-renderer" }
tokio-util.workspace = true
