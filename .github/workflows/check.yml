# The crates at the repository root that the v1 workspace still path-depends
# on (until they move into it), plus repository-wide checks: Markdown links and
# GitHub Actions workflows. v1.yml gates the v1 workspace.
name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-checks
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust formatting
        run: |
          rustup update stable --no-self-update
          rustup component add rustfmt --toolchain stable
          cargo +stable fmt --all -- --check
      - name: Shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck crates/capture/prysm-capture/video_test.sh
      - name: Documentation checker tests and repository links
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 scripts/check-doc-links.py
      - name: GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update Rust
        run: |
          rustup update stable --no-self-update
          rustup component add clippy --toolchain stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev libudev-dev pkg-config
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: rust
      - name: Default workspace tests and doctests
        run: cargo +stable test --locked --workspace --no-default-features
      - name: All-feature workspace tests and doctests
        run: cargo +stable test --locked --workspace --all-features
      - name: Compile and lint all targets, including examples
        run: |
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo +stable clippy --locked --workspace --all-targets --no-default-features -- -D warnings
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo +stable doc --locked --workspace --all-features --no-deps
