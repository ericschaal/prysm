[package]
name = "prysm-web-portal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "HTTP surface: embedded frontend assets and the JSON control API, same-origin by default"

[dependencies]
prysm-core.workspace = true
prysm-ports.workspace = true
prysm-protocol.workspace = true
prysm-runtime.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "time", "io-util", "sync", "rt"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# The preview's JPEG encoder (the earlier portal used the same); decoding is for tests.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.23"
# The upgrade's accept key; the remote source speaks the WebSocket itself.
tungstenite = { workspace = true, features = ["handshake"] }
tracing.workspace = true

[dev-dependencies]
prysm-capture-remote.workspace = true
prysm-runtime = { workspace = true, features = ["testkit"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "io-util"] }

[lints]
workspace = true
