[package]
name = "prysm-capture-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Blocking TCP frame transport between a capture-only host and a lighting host"

[features]
# `utoipa::ToSchema` for the settings, for the contract exporter.
schema = ["dep:utoipa"]

[dependencies]
prysm-core.workspace = true
prysm-ports.workspace = true
serde.workspace = true
prysm-h264.workspace = true
thiserror.workspace = true
tracing.workspace = true
utoipa = { workspace = true, optional = true }

[dev-dependencies]
prysm-runtime = { workspace = true, features = ["testkit"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
