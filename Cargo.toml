[workspace]
resolver = "3"
members = [
    "crates/engine/ports",
    "crates/engine/runtime",
    "crates/engine/protocol",
    "crates/engine/webos-link",
    "crates/engine/core",
    "crates/engine/processor",
    "crates/engine/version",
    "crates/adapters/capture-device",
    "crates/adapters/capture-device-sys",
    "crates/adapters/capture-file",
    "crates/adapters/capture-remote",
    "crates/adapters/capture-webos",
    "crates/adapters/capture-webos-sys",
    "crates/adapters/h264",
    "crates/adapters/h264-rvenc-sys",
    "crates/adapters/output-wled",
    "crates/adapters/settings-file",
    "crates/adapters/webos-luna-sys",
    "crates/surfaces/tui",
    "crates/surfaces/web-portal",
    "crates/hosts/common",
    "crates/hosts/headless",
    "crates/hosts/tui",
    "crates/hosts/webos",
    "crates/hosts/webos-slim",
    "crates/hosts/webos-service",
    "crates/tools/export-contracts",
    "crates/tools/testkit",
    "crates/tools/xtask",
]
default-members = ["crates/hosts/headless", "crates/hosts/tui"]

[workspace.package]
# Not the product version: that is the VERSION file alone, read by
# prysm-version (crates/engine/version). The crates are never published.
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Frame and colour types, processing
prysm-core = { path = "crates/engine/core" }
prysm-processor = { path = "crates/engine/processor" }
# The product version (VERSION)
prysm-version = { path = "crates/engine/version" }
# Runtime
prysm-ports = { path = "crates/engine/ports" }
prysm-runtime = { path = "crates/engine/runtime" }
prysm-protocol = { path = "crates/engine/protocol" }
prysm-webos-link = { path = "crates/engine/webos-link" }
# Adapters
prysm-capture-device = { path = "crates/adapters/capture-device" }
prysm-capture-device-sys = { path = "crates/adapters/capture-device-sys" }
prysm-capture-file = { path = "crates/adapters/capture-file" }
prysm-capture-remote = { path = "crates/adapters/capture-remote" }
prysm-capture-webos = { path = "crates/adapters/capture-webos" }
prysm-h264 = { path = "crates/adapters/h264" }
prysm-webos-luna-sys = { path = "crates/adapters/webos-luna-sys" }
prysm-output-wled = { path = "crates/adapters/output-wled" }
prysm-settings-file = { path = "crates/adapters/settings-file" }
# Surfaces and hosts
prysm-surface-tui = { path = "crates/surfaces/tui" }
prysm-web-portal = { path = "crates/surfaces/web-portal" }
prysm-host = { path = "crates/hosts/common" }
# Tests only
prysm-testkit = { path = "crates/tools/testkit" }
# External
# Only the features the hosts' help and usage errors need; no colour or suggestions.
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
futures = "0.3"
# Data-parallel sampling on a dedicated pool (crates/engine/processor/src/workers.rs).
rayon = "1.11"
libloading = "0.9"
nix = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tracing = "0.1"
# The capture stream: a blocking WebSocket; rustls with ring (no C toolchain
# beyond what ring needs) and the system's certificate authorities for wss.
tungstenite = { version = "0.30", default-features = false }
http = "1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
utoipa = "6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Desktop release builds (cargo xtask dist, the Docker image, the .deb) keep
# their symbols, so panics and backtraces name functions.

# The TV packages (packaging/webos/build-ipk.sh): smaller and faster ARMv7
# binaries, stripped for the TV's small storage (ipk.py refuses unstripped
# ones). Integer overflow panics, as in tests, instead of wrapping silently.
[profile.webos]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = false
strip = true
overflow-checks = true
