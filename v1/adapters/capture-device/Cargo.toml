[package]
name = "prysm-capture-device"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
wire = ["dep:serde", "dep:prysm-protocol"]
schema = ["wire", "dep:utoipa", "prysm-protocol/schema"]

[dependencies]
prysm-contract.workspace = true
prysm-capture = { path = "../../../crates/capture/prysm-capture", default-features = false }
prysm-protocol = { workspace = true, optional = true }
prysm-core.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util = "0.7"
futures.workspace = true
serde = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
prysm-application.workspace = true
prysm-flow.workspace = true
prysm-processor.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
