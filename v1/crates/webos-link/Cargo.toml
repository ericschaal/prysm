[package]
name = "prysm-webos-link"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The webOS supervisor <-> worker protocol: argv, line-delimited JSON messages and exit codes"

[features]
# The worker side: stdio plumbing, stop reasons and the process entry point.
worker = ["dep:tokio", "dep:nix"]

[dependencies]
prysm-ports.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time", "signal"] }
nix = { workspace = true, optional = true, features = ["fs", "process", "signal"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[lints]
workspace = true
