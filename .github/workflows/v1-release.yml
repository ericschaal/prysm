# Release of the v1 prysm-headless host: a multi-arch image on GHCR
# (ghcr.io/<owner>/prysm-headless) and Debian packages attached to a GitHub
# release. Separate from the shipping product's release in check.yml, which
# publishes ghcr.io/<owner>/prysm on its own tags.
#
# A `v1.*` tag must equal "v" + the [workspace.package] version in
# v1/Cargo.toml (e.g. v1.0.0-alpha.0). Manual runs build and smoke-test both
# architectures and keep the image and .deb as workflow artifacts; only a tag
# publishes. Everything is built by v1/packaging/docker/Dockerfile.
name: V1 release
on:
  push:
    tags:
      - 'v1.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERFILE: v1/packaging/docker/Dockerfile

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          target: runtime
          load: true
          tags: prysm-headless:local
          cache-from: type=gha,scope=prysm-v1-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=prysm-v1-${{ matrix.arch }}
      - name: Smoke-test image
        run: v1/packaging/docker/smoke.sh prysm-headless:local
      - name: Build Debian package
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          target: deb
          outputs: type=local,dest=${{ runner.temp }}/deb
          cache-from: type=gha,scope=prysm-v1-${{ matrix.arch }}
      - name: Inspect and install Debian package
        env:
          DEB_DIRECTORY: ${{ runner.temp }}/deb
        run: |
          deb=$(ls "$DEB_DIRECTORY"/prysm-headless_*_"${{ matrix.arch }}".deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          # No systemd in the container: checks dependencies, user and layout.
          docker run --rm -v "$DEB_DIRECTORY:/deb:ro" debian:bookworm-slim sh -euc '
            apt-get update -qq
            apt-get install -y -qq /deb/prysm-headless_*.deb >/dev/null
            id prysm
            id -nG prysm | grep -qw video
            /usr/bin/prysm-headless --help >/dev/null
            apt-get purge -y -qq prysm-headless >/dev/null
            test ! -e /usr/bin/prysm-headless'
      - name: Export image
        run: docker image save --output "${{ runner.temp }}/prysm-headless-${{ matrix.arch }}.tar" prysm-headless:local
      - uses: actions/upload-artifact@v4
        with:
          name: prysm-headless-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/prysm-headless-${{ matrix.arch }}.tar
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: prysm-headless-deb-${{ matrix.arch }}
          path: ${{ runner.temp }}/deb/*.deb
          retention-days: 7
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('v1/Cargo.toml').read_text())['workspace']['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match the v1 workspace version'
          PY
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        env:
          ARTIFACTS: ${{ runner.temp }}/artifacts
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/prysm-headless"
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            docker image load --input "$ARTIFACTS/prysm-headless-image-$arch/prysm-headless-$arch.tar"
            docker image tag prysm-headless:local "$image:$version-$arch"
            docker image push "$image:$version-$arch"
          done
          docker buildx imagetools create --tag "$image:$version" "$image:$version-amd64" "$image:$version-arm64"
          docker buildx imagetools inspect --raw "$image:$version" | python3 -c 'import json,sys; assert {m["platform"]["architecture"] for m in json.load(sys.stdin)["manifests"] if m["platform"].get("os") == "linux"} == {"amd64", "arm64"}'
      - name: Attach Debian packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS: ${{ runner.temp }}/artifacts
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
              --title "Prysm $GITHUB_REF_NAME (headless)" \
              --notes "prysm-headless $GITHUB_REF_NAME. Image: ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/prysm-headless:${GITHUB_REF_NAME#v}. See v1/packaging/README.md."
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber "$ARTIFACTS"/prysm-headless-deb-*/*.deb
