name: Documentation links

on:
  push:
    paths:
      - '**/*.md'
      - 'docs/users/examples/*.toml'
      - 'scripts/check-doc-links.py'
      - 'scripts/tests/test_doc_links.py'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/users/examples/*.toml'
      - 'scripts/check-doc-links.py'
      - 'scripts/tests/test_doc_links.py'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Link checker regression tests
        run: python3 -m unittest discover -s scripts/tests
      - name: Repository paths, images, anchors and public URLs
        run: python3 scripts/check-doc-links.py --external
