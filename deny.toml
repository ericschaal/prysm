# cargo deny check: the supply-chain job in .github/workflows/ci.yml.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# A RustSec vulnerability, unmaintained or unsound advisory fails the check
# (cargo-deny's defaults). Ignore one only when no fixed version exists, with
# the reason.
ignore = [
    # humantime is unmaintained and has no maintained release. Only xtask
    # uses it (manifest timestamps in `cargo xtask dist`); nothing shipped.
    "RUSTSEC-2026-0542",
]

[licenses]
# The licences of the current dependency tree (`cargo deny list`); a crate
# under any other licence needs a decision first.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates (publish = false).
ignore = true

[bans]
# Several versions of one crate are common in this tree (windows-sys,
# itertools, thiserror); they are reported, not refused.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# v4l, pinned to a commit in crates/adapters/capture-device-sys/Cargo.toml.
allow-git = ["https://github.com/raymanfx/libv4l-rs.git"]
