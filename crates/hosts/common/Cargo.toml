[package]
name = "prysm-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared by the hosts: the embedded portal bundles; for the desktop hosts arguments, logging, portal, signals, status"

[features]
desktop = [
    "dep:clap",
    "dep:prysm-settings-file",
    "dep:prysm-version",
    "dep:tokio",
    "prysm-runtime/logging",
    "dep:prysm-capture-file",
    "dep:prysm-capture-remote",
]

[dependencies]
prysm-ports.workspace = true
prysm-runtime.workspace = true
prysm-settings-file = { workspace = true, optional = true }
prysm-version = { workspace = true, optional = true }
prysm-web-portal.workspace = true
prysm-capture-file = { workspace = true, optional = true }
prysm-capture-remote = { workspace = true, optional = true }
prysm-output-wled.workspace = true
clap = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "signal", "sync"], optional = true }

[dev-dependencies]
prysm-runtime = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
