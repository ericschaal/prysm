[package]
name = "prysm-capture-webos-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "LG webOS VTCapture FFI behind a safe, single-threaded capture handle"

[dependencies]
libloading.workspace = true
thiserror.workspace = true
# The one Luna binding: the registration precheck.
prysm-webos-luna-sys.workspace = true

[build-dependencies]
cc = "1"

# One of the two v1 crates allowed to use `unsafe` (with webos-luna-sys). Every block carries a SAFETY note.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
